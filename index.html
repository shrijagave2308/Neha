<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <canvas id="bg"></canvas>
  <div class="glow"></div>

  <div class="scene">
    <div class="open-lines">
      <p class="date fade-in" style="animation-delay: 1s;">23 September&hellip;</p>

      <p class="fade-in-1" style="animation-delay: 2s;">
        Some days quietly pass by,<br>
        but some become unforgettable.
      </p>

      <p class="fade-in-2" style="animation-delay: 3s;">
        23 September became special<br>
        the day someone truly special was born..
        <br>And today…
      </p>

      <h2 class="fade-in-3" style="animation-delay: 4s;">
        is your beautiful day. ❤️
      </h2>
    </div>

    <button class="continue fade-in-3" id="beginBtn" style="animation-delay: 5s; opacity: 0;">
      Let’s Celebrate ❤️

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">

        <path d="M5 12h14M13 6l6 6-6 6" />

      </svg>
    </button>

  </div>

  <script src="index.js"></script>

</body>

</html>
